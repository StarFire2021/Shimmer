name: Build & Release

# Builds the self-contained app and the Inno Setup installer, then publishes a
# GitHub Release with the installer attached — triggered when you push a version
# tag, e.g.:   git tag v1.1.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release

jobs:
  release:
    runs-on: windows-latest   # WPF only builds on Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compute version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish src/Shimmer/Shimmer.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o "${{ github.workspace }}\publish"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
                  "/DPublishDir=${{ github.workspace }}\publish" `
                  "installer\shimmer.iss"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/Shimmer-Setup-*.exe
          generate_release_notes: true
          body: |
            Windows installer for Shimmer ${{ steps.ver.outputs.version }}.

            > On first run Windows SmartScreen may warn because the installer isn't
            > code-signed — click **More info → Run anyway**.
